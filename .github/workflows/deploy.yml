name: Deploy plugin repo

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: oven-sh/setup-bun@v2
      - run: chmod +x gradlew
      - run: ./gradlew packageAllPlugins
      - run: bunx --bun revenge-plugin generate-index --dist build/dist --base-url https://k1ng0p.github.io/revenge-next-plugins/
      - run: |
          mkdir -p _site
          cp build/dist/*.zip _site/
          cp index.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4